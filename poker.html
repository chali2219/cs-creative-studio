

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Poker Card Set | CS Creative Studio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 20px;
      background: #07111f;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    a {
      color: #48e5ef;
      text-decoration: none;
    }

    h1 {
      margin-bottom: 10px;
    }

    .intro {
      color: #b7c6d8;
      margin-bottom: 30px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      background: #101e30;
    }

    .gallery img {
      width: 100%;
      height: 300px;
      object-fit: contain;
      background: #101e30;
      border: 1px solid #24435a;
      border-radius: 12px;
      padding: 10px;
      cursor: pointer;
      display: block;
    }

    .gallery img:hover {
      border-color: #48e5ef;
    }

    /* PREVIEW ONLY WATERMARK */
    .gallery-item::after {
      content: "PREVIEW ONLY";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-25deg);
      color: rgba(255,255,255,0.65);
      font-size: clamp(18px, 4vw, 30px);
      font-weight: bold;
      letter-spacing: 4px;
      white-space: nowrap;
      pointer-events: none;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    /* FULL IMAGE VIEWER */
    #viewer {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.92);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }

    #viewer img {
      max-width: 95%;
      max-height: 90vh;
      object-fit: contain;
    }

    /* VIEWER WATERMARK */
    #viewer::after {
      content: "PREVIEW ONLY";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-25deg);
      color: rgba(255,255,255,0.65);
      font-size: clamp(22px, 5vw, 42px);
      font-weight: bold;
      letter-spacing: 5px;
      white-space: nowrap;
      pointer-events: none;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    #close {
      position: absolute;
      top: 15px;
      right: 25px;
      font-size: 36px;
      color: white;
      cursor: pointer;
      z-index: 11;
    }
  </style>
</head>

<body>

  <main class="container">

    <a href="index.html">← Back to Portfolio</a>

    <h1>Poker Card Set</h1>

    <p class="intro">
      Custom playing card designs by CS Creative Studio.
    </p>

    <div class="gallery">

      <div class="gallery-item">
        <img src="images/Poker-Card-Set/poker-card-01.jpg"
             alt="Poker Card Design 1"
             onclick="showImage(this.src)">
      </div>

      <div class="gallery-item">
        <img src="images/Poker-Card-Set/poker-card-02.jpg"
             alt="Poker Card Design 2"
             onclick="showImage(this.src)">
      </div>

      <div class="gallery-item">
        <img src="images/Poker-Card-Set/poker-card-03.jpg"
             alt="Poker Card Design 3"
             onclick="showImage(this.src)">
      </div>

      <div class="gallery-item">
        <img src="images/Poker-Card-Set/poker-card-04.jpg"
             alt="Poker Card Design 4"
             onclick="showImage(this.src)">
      </div>

      <div class="gallery-item">
        <img src="images/Poker-Card-Set/poker-card-05.jpg"
             alt="Poker Card Design 5"
             onclick="showImage(this.src)">
      </div>

      <div class="gallery-item">
        <img src="images/Poker-Card-Set/poker-card-06.jpg"
             alt="Poker Card Design 6"
             onclick="showImage(this.src)">
      </div>

    </div>

  </main>

  <!-- IMAGE VIEWER -->
  <div id="viewer" onclick="hideImage()">

    <span id="close">&times;</span>

    <img id="largeImage"
         src=""
         alt="Enlarged poker card design">

  </div>

  <script>
    function showImage(src) {
      document.getElementById('largeImage').src = src;
      document.getElementById('viewer').style.display = 'flex';
    }

    function hideImage() {
      document.getElementById('viewer').style.display = 'none';
    }
  </script>

</body>
</html>
